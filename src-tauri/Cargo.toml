[package]
name = "dilo"
version = "0.3.0"
description = "Dilo — dictado por voz offline, en español"
authors = ["Alfonso Contreras", "cjpais"]
edition = "2021"
license = "MIT"
default-run = "dilo"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dilo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
once_cell = "1"
tauri = { version = "2.10.2", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = "1.43.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
chrono = "0.4"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is now ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere). Per-platform backend features are added in the target tables.
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.1.3", default-features = false }
handy-keys = "0.3.0"
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.6"
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# TTS local (src/tts/) — motor Supertonic 3, ONNX vía `ort`. Versión pineada
# igual que `transcribe-rs` (ver su Cargo.toml) para que Cargo unifique una
# sola instancia de `ort`/`ndarray` en el build en vez de compilar el
# runtime de ONNX dos veces.
#
# T002 (notetaker de reuniones, ver specs/001-meeting-notetaker/research.md
# §1): este mismo `ort` alcanza para correr los modelos ONNX de diarización
# de sherpa-onnx (segmentación pyannote + embeddings de hablante) cuando
# lleguen en T009 — no hace falta sumar el crate/binding de sherpa-onnx. El
# propio sherpa-onnx carga esos modelos con un `Ort::Session` plano, sin ops
# custom (ver sherpa-onnx/csrc/offline-speaker-segmentation-pyannote-model.cc
# y speaker-embedding-extractor-model.cc), igual que `tts/supertonic.rs` ya
# hace acá. Detalle completo en el reporte de T002.
ort = "=2.0.0-rc.12"
ndarray = "0.17"
rand = "0.8"
rand_distr = "0.4"
unicode-normalization = "0.1"
# T009 (diarización, ver managers/diarization.rs y research.md §1 "Corrección
# encontrada"): dos dependencias nuevas, ambas puro Rust.
#
# `kaldi-native-fbank` computa los features Fbank (80-dim log-mel) que el
# modelo de embeddings de hablante (CAM++/3D-Speaker) espera como entrada.
# Es un port directo de la MISMA librería C++ `kaldi-native-fbank` que
# sherpa-onnx vendorea internamente (confirmado leyendo
# sherpa-onnx/csrc/features.cc, que incluye literalmente
# "kaldi-native-fbank/csrc/online-feature.h") — no es una reimplementación
# aproximada de Fbank, es el mismo algoritmo de origen.
kaldi-native-fbank = "0.1"
# `kodama` implementa clustering jerárquico/aglomerativo puro Rust, inspirado
# explícitamente en `fastcluster` (Müllner) — la misma familia de algoritmo
# que usa sherpa-onnx/csrc/fast-clustering.cc (confirmado leyendo ese
# archivo: usa un vendored `fastcluster-all-in-one.h`). Candidato que ya
# había identificado T002 en research.md; T009 lo confirma y lo agrega.
kodama = "0.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.0"

[target.'cfg(windows)'.dependencies]
# ONNX Runtime on Windows is CPU-only (no ort-directml), matching macOS/Linux.
# The DirectML EP was experimental and, more importantly, pulled in pyke's
# prebuilt ONNX Runtime which is compiled with a global /arch:AVX2 baseline that
# executes BMI2/AVX in a static initializer and crashes at process startup on any
# pre-Haswell CPU (Sandy/Ivy Bridge, older AMD). Dropping the feature means we
# link a baseline ONNX Runtime (dynamically, via ORT_LIB_LOCATION in build.yml)
# with proper runtime CPU dispatch. Base `transcribe-rs` (features = ["onnx"])
# is inherited here, so Parakeet/Moonshine/etc. still run on CPU.
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

# Whisper backend per Windows arch. x86_64 ships the Vulkan GPU backend and
# keeps the dynamic-backends posture (loadable per-ISA CPU modules + Vulkan),
# where runtime ISA scoring (GGML_CPU_ALL_VARIANTS) earns the extra shipped DLLs.
#
# Windows-on-ARM is CPU-only: its Adreno Vulkan drivers are immature, and
# ggml-vulkan's shader generator (vulkan-shaders-gen) does not build under the
# clang-cl/lld toolchain that ggml's ARM CPU backend requires. dynamic-backends
# buys nothing on ARM — ALL_VARIANTS is an x86 concept, so a DL build there is
# just a single portable CPU module shipped as a DLL. So ARM links transcribe-cpp
# STATICALLY (no features = static CPU-only): the one CPU backend is compiled into
# handy.exe and we ship zero DLLs, which sidesteps the installer's per-DLL
# signtool verify entirely. CI pins -DGGML_NATIVE=OFF (see build.yml) so the
# static build targets a portable ARM baseline, not the build runner's CPU.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["metal"] }
# Captura de audio del sistema (system_audio.rs, T-audio del notetaker de
# reuniones): process taps de CoreAudio, macOS 14.2+. Los cuatro crates ya
# viven en el árbol como dependencias transitivas de `cpal` (vía
# `coreaudio-rs` -> `objc2-audio-toolbox`/`objc2-core-audio`) y de
# `tauri-nspanel`/`tauri` (vía `objc2-app-kit`/`objc2-foundation`); declararlos
# acá sólo los hace directamente importables, no agrega crates nuevos al
# árbol de compilación (confirmado con `cargo tree`, ver el reporte de esta
# tarea). Rangos caret (no `=`) para que `git merge upstream/main` siga
# barato — un pin exacto choca con eso apenas upstream toque una de estas
# crates por otro camino (M4 de la revisión). Verificado con `cargo tree`
# que siguen resolviendo a las mismas versiones y que `Cargo.lock` no gana
# paquetes.
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
libc = "0.2.182"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
transcribe-cpp = { version = "0.1.3", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[patch.crates-io]
tauri-runtime = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }
tauri-runtime-wry = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }
tauri-utils = { git = "https://github.com/cjpais/tauri.git", branch = "handy-2.10.2" }

[dev-dependencies]
tempfile = "3"
# Runtime mock de Tauri (`tauri::test::mock_app`): sin esto no hay forma de
# probar que un evento backend->frontend realmente se emite — un `AppHandle`
# real necesita event loop y ventana. Sólo dev: no entra en el binario.
tauri = { version = "2.10.2", features = ["test"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
