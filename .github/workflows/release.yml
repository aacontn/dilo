name: Release

# Manual a propósito. Un release de Dilo firma con la identidad de Alfonso,
# y notariza contra Apple: ninguna de las dos cosas se dispara sola desde un
# push. Dilo no va a la App Store (2026-10-15): es para uso propio.
on:
  workflow_dispatch:

# Los secrets que espera este workflow (todos en Settings → Secrets → Actions):
#
#   APPLE_CERTIFICATE               .p12 del Developer ID Application, en base64,
#                                   con la intermedia "Developer ID Certification
#                                   Authority" adentro o find-identity no lo da
#                                   por válido.
#   APPLE_CERTIFICATE_PASSWORD      contraseña de ese .p12
#   KEYCHAIN_PASSWORD               contraseña del llavero temporal del runner
#   APPLE_API_ISSUER                issuer de la Team key de App Store Connect
#   APPLE_API_KEY                   id de esa key (el de AuthKey_XXXX.p8)
#   APPLE_API_KEY_P8                contenido del .p8
#
# Ya existen en el repo del Dilo Tauri (aacontn/dilo).

jobs:
  dilo:
    name: Dilo (venta directa)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Mismo import que build.yml del repo Tauri, que es donde se aprendió
      # que `default-keychain` NO basta: codesign y find-identity buscan en la
      # LISTA de búsqueda, y un llavero nuevo no entra solo a ella.
      - name: Importar el certificado
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::sin APPLE_CERTIFICATE — se firma ad-hoc y no se notariza"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificado.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificado.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$RUNNER_TEMP/certificado.p12"
          security find-identity -v -p codesigning build.keychain

      # El Developer ID de Apple si existe; si no, la primera identidad válida.
      # Hardened Runtime SÓLO con Developer ID real: es requisito de la
      # notarización, y sobre una firma ad-hoc enciende library validation
      # contra dylibs de otro "Team" y dyld se niega a cargar Sparkle.
      - name: Elegir identidad
        id: identidad
        run: |
          IDS="$(security find-identity -v -p codesigning build.keychain 2>/dev/null || true)"
          CERT_ID="$(echo "$IDS" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}' || true)"
          if [ -z "$CERT_ID" ]; then
            CERT_ID="$(echo "$IDS" | grep -m1 '"' | awk -F'"' '{print $2}' || true)"
          fi
          if [[ "$CERT_ID" == *"Developer ID Application"* ]]; then
            HARDENED=YES
            TEAM_ID="$(sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p' <<<"$CERT_ID")"
          else
            HARDENED=NO
            TEAM_ID=""
            echo "::warning::sin Developer ID: firma ad-hoc, sin Hardened Runtime y sin notarizar"
          fi
          {
            echo "cert_id=$CERT_ID"
            echo "hardened=$HARDENED"
            echo "team_id=$TEAM_ID"
          } >> "$GITHUB_OUTPUT"
          echo "identidad: ${CERT_ID:-<ad-hoc>} · hardened runtime: $HARDENED"

      - name: Archivar Dilo
        env:
          CERT_ID: ${{ steps.identidad.outputs.cert_id }}
          HARDENED: ${{ steps.identidad.outputs.hardened }}
          TEAM_ID: ${{ steps.identidad.outputs.team_id }}
        run: |
          set -o pipefail
          ARGS=(DILO_HARDENED_RUNTIME="$HARDENED")
          if [ -n "$CERT_ID" ]; then
            ARGS+=(CODE_SIGN_IDENTITY="$CERT_ID" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID")
          else
            ARGS+=(CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="")
          fi
          xcodebuild archive \
            -project Dilo.xcodeproj \
            -scheme Dilo \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Dilo.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination 'generic/platform=macOS' \
            "${ARGS[@]}" | tail -50
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/Dilo.xcarchive/Products/Applications/Dilo.app" "$RUNNER_TEMP/export/"

      # Sparkle trae helpers precompilados —Updater.app, Autoupdate y dos XPC—
      # y Xcode no refirma el contenido de un framework precompilado: llegan
      # ad-hoc, sin team y sin timestamp seguro, que es justo lo que la
      # notarización rechaza. codesign sella hasheando el contenido, así que
      # esto va de adentro hacia afuera y la app se refirma al final CON sus
      # entitlements: --force bota los que no se le pasen, y bajo Hardened
      # Runtime una app sin audio-input no recibe el micrófono nunca.
      - name: Refirmar Sparkle y la app
        if: steps.identidad.outputs.hardened == 'YES'
        env:
          CERT_ID: ${{ steps.identidad.outputs.cert_id }}
          TEAM_ID: ${{ steps.identidad.outputs.team_id }}
        run: |
          APP="$RUNNER_TEMP/export/Dilo.app"
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
          for objetivo in \
            "$SPARKLE/Versions/B/XPCServices/Downloader.xpc" \
            "$SPARKLE/Versions/B/XPCServices/Installer.xpc" \
            "$SPARKLE/Versions/B/Updater.app" \
            "$SPARKLE/Versions/B/Autoupdate" \
            "$SPARKLE"; do
            [ -e "$objetivo" ] || continue
            codesign --force --options runtime --timestamp --sign "$CERT_ID" "$objetivo"
          done
          codesign --force --options runtime --timestamp \
            --entitlements Dilo.entitlements --sign "$CERT_ID" "$APP"
          codesign --verify --deep --strict "$APP"
          # La salida se captura en vez de mandarla a grep: con pipefail, grep
          # sale al primer match, mata a codesign con SIGPIPE y el pipeline
          # reporta error por un binario que está bien firmado.
          INFO="$(codesign -dvv "$APP" 2>&1 || true)"
          [[ "$INFO" == *"TeamIdentifier=$TEAM_ID"* ]] || { echo "la app no quedó con el team $TEAM_ID"; exit 1; }
          [[ "$INFO" == *"runtime"* ]] || { echo "la app no quedó con Hardened Runtime"; exit 1; }
          ENT="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          [[ "$ENT" == *"com.apple.security.device.audio-input"* ]] \
            || { echo "la app firmada perdió el entitlement de micrófono"; exit 1; }

      - name: Armar el DMG
        env:
          CERT_ID: ${{ steps.identidad.outputs.cert_id }}
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$RUNNER_TEMP/export/Dilo.app" "$STAGE/Dilo.app"
          ln -s /Applications "$STAGE/Applications"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$RUNNER_TEMP/export/Dilo.app/Contents/Info.plist")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DMG="$RUNNER_TEMP/Dilo-v$VERSION.dmg"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          # hdiutil contesta "Resource busy" si el bundle recién copiado
          # todavía se está indexando, así que se le dan varios intentos.
          for intento in 1 2 3 4 5; do
            hdiutil create -volname "Dilo $VERSION" -srcfolder "$STAGE" \
              -ov -format UDZO "$DMG" >/dev/null 2>&1 && break
            [ "$intento" = 5 ] && { echo "hdiutil no pudo crear el DMG"; exit 1; }
            echo "hdiutil ocupado, reintento $intento"
            sleep 5
          done
          hdiutil verify "$DMG" >/dev/null
          # Firmar el contenedor va ANTES de notarizar: firmar un DMG ya
          # grapado lo reescribe y bota el ticket.
          if [ -n "$CERT_ID" ]; then
            codesign --force --timestamp --sign "$CERT_ID" "$DMG"
          fi

      # Paso propio, con reintentos. El fallo del 14-sep-2026 en el repo Tauri
      # no fue la firma: notarytool subió bien y se cayó **sondeando el estado**
      # —un error de red mientras esperaba—. Reintentar el submit completo
      # cuesta unos minutos; descubrirlo después de publicar cuesta un release.
      - name: Notarizar
        if: steps.identidad.outputs.hardened == 'YES'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::warning::hay Developer ID pero faltan APPLE_API_* — se firma sin notarizar"
            exit 0
          fi
          LLAVE="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$LLAVE"
          chmod 600 "$LLAVE"
          ok=0
          for intento in 1 2 3; do
            if xcrun notarytool submit "$DMG" \
                --key "$LLAVE" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
                --wait --timeout 30m; then
              ok=1
              break
            fi
            echo "::warning::notarytool falló en el intento $intento (casi siempre es red al sondear)"
            sleep 60
          done
          rm -f "$LLAVE"
          [ "$ok" = 1 ] || { echo "la notarización falló tres veces"; exit 1; }
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          # Notarizar el DMG notariza la app de adentro, así que la app se
          # grapa contra los registros de Apple sin un segundo envío. Una app
          # grapada valida sin red, que es lo que importa en un laptop que
          # despierta, se actualiza y relanza antes de que vuelva el wifi.
          xcrun stapler staple "$RUNNER_TEMP/export/Dilo.app"

      # El ZIP es lo que consume Sparkle; el appcast se genera y se firma en el
      # Mac de Alfonso con scripts/release.sh, porque la llave privada vive en
      # su Llavero y no sube a ningún runner.
      - name: Empaquetar la actualización de Sparkle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/Dilo.app" "$RUNNER_TEMP/Dilo-v$VERSION.zip"

      - name: Subir artefactos
        uses: actions/upload-artifact@v7
        with:
          name: dilo-directo
          path: |
            ${{ runner.temp }}/Dilo-v*.dmg
            ${{ runner.temp }}/Dilo-v*.zip
